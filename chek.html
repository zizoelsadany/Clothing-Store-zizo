<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clothing Store Checkout</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style3.css">
</head>
<body>
  <div class="checkout-container">
    <!-- Left: Customer + Payment -->
    <div class="form-section">
      <h2>Customer Information</h2>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" placeholder="Enter your name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" placeholder="+20 10 000 0000">
      </div>

      <h2>Shipping Address</h2>
      <div class="form-group">
        <label>Address</label>
        <input type="text" placeholder="Street, Building, Apartment">
      </div>
      <div class="form-group">
        <label>City</label>
        <input type="text" placeholder="City">
      </div>
      <div class="form-group">
        <label>Postal Code</label>
        <input type="text" placeholder="12345">
      </div>

      <h2>Payment Method</h2>
      <div class="payment-methods">
        <label><input type="radio" name="payment" value="card"> 💳 Card</label>
        <label><input type="radio" name="payment" value="vodafone"> 📱 Vodafone Cash</label>
        <label><input type="radio" name="payment" value="cod"> 🚚 Cash on Delivery</label>
      </div>
      <div id="payment-details"></div>
    </div>

    <!-- Right: Cart -->
    <div class="summary-section">
      <h2>Order Summary</h2>
      <div id="cart-items"></div>
      <div class="summary-total"><span>Total</span><span id="cart-total">0 EGP</span></div>
      <button class="checkout-btn">Confirm & Pay</button>
<a href="index.html" class="checkout-btn">⬅ BACK HOME</a>

    </div>
  </div>

  <script src="chek.js"></script>
</body>
</html>
